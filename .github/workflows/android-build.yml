name: CloudVault checks and Android APK

on:
  push:
    branches: [main, 'feature/**']
    paths:
      - 'source/native-bundle/**'
      - 'native-patches/**'
      - 'build.sh'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'source/native-bundle/**'
      - 'native-patches/**'
      - 'build.sh'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand app source bundle
        run: cat source/native-bundle/part*.b64 | base64 -d | tar -xJ -C .
      - name: Audit Play Store privacy and account deletion support
        run: |
          echo '--- Privacy policy and account deletion references ---'
          grep -RniE 'delete.{0,30}account|account.{0,30}delete|privacy policy|delete-account|data deletion' web server 2>/dev/null | head -100 || true
          echo '--- Server route and DELETE handlers ---'
          grep -nE 'pathname|request\.method|DELETE|/auth|/account' server/index.js | head -120 || true
          echo '--- Candidate policy or deletion pages ---'
          find web -maxdepth 3 -type f | grep -Ei 'privacy|delete|account' | head -80 || true
      - name: Inspect account and policy insertion points
        run: |
          echo '--- Main account settings ---'
          grep -n -A 32 -B 5 'function renderSettingsPage' web/src/main.js
          echo '--- Main app action handling ---'
          grep -n -A 55 -B 8 'account-sign-out' web/src/main.js
          echo '--- Account sign-out helpers ---'
          grep -n -A 35 -B 5 'async function signOutCloudVault' web/src/main.js
          echo '--- Server final auth routes ---'
          sed -n '90,255p' server/index.js
          echo '--- Schema user foreign keys ---'
          grep -n -A 12 -B 2 'CREATE TABLE IF NOT EXISTS cv_users\|REFERENCES cv_users' server/schema.sql
          echo '--- Web root and deployment route config ---'
          find web -maxdepth 2 -type f | head -40
          cat vercel.json
      - name: Locate deployed Supabase API and account UI handlers
        run: |
          echo '--- Top-level extracted source ---'
          find . -maxdepth 4 -type f | sort | head -180
          echo '--- Supabase function folders ---'
          find . -path '*functions*' -type f | head -100
          echo '--- Account deletion and route symbols in all app source ---'
          grep -RniE 'account-sign-out|signOutCloudVault|serve\(|Deno\.serve|cloudvault-api|auth/register|cv_users' . --exclude-dir=.git --exclude='*.b64' | head -180 || true
          echo '--- Main action router context ---'
          grep -n -A 70 -B 5 'account-sign-out' web/src/main.js
          echo '--- Sign out helper context ---'
          grep -n -A 22 -B 4 'async function signOutCloudVault' web/src/main.js
      - name: Add prominent Telegram API settings link
        run: node native-patches/add-telegram-api-link.mjs web/src/main.js
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check web/src/main.js
          node --check web/src/telegram.js
          node --check server/index.js
      - name: Run tests
        run: npm test
      - name: Build web output
        run: npm run build

  android-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Expand app source bundle
        run: cat source/native-bundle/part*.b64 | base64 -d | tar -xJ -C .
      - name: Upgrade Android SDK targets to API 36
        run: node native-patches/patch-android-api-36.mjs android/app/build.gradle.kts
      - name: Apply Android manifest merger fix
        run: cp native-patches/android/app/src/main/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
      - name: Add prominent Telegram API settings link
        run: node native-patches/add-telegram-api-link.mjs web/src/main.js
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Apply TDLib 1.8.56 compatibility fixes
        run: node native-patches/patch-tdlib-compat.mjs android/app/src/main/java/com/cloudvault/app/TelegramManager.kt
      - name: Build debug APK
        run: gradle --no-daemon -p android :app:assembleDebug
      - name: Inspect Android manifest metadata
        run: |
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging android/app/build/outputs/apk/debug/app-debug.apk | head -n 8
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
      - name: Build Play Store App Bundle
        run: gradle --no-daemon -p android :app:bundleRelease
      - name: Inspect App Bundle output
        run: ls -lh android/app/build/outputs/bundle/release/app-release.aab
      - name: Upload unsigned release App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: cloudvault-android-release-aab-unsigned
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudvault-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
