name: CloudVault checks and Android APK

on:
  push:
    branches: [main, 'feature/**']
    paths:
      - 'source/native-bundle/**'
      - 'native-patches/**'
      - 'build.sh'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'source/native-bundle/**'
      - 'native-patches/**'
      - 'build.sh'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand app source bundle
        run: cat source/native-bundle/part*.b64 | base64 -d | tar -xJ -C .
      - name: Add prominent Telegram API settings link
        run: node native-patches/add-telegram-api-link.mjs web/src/main.js
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check web/src/main.js
          node --check web/src/telegram.js
          node --check server/index.js
      - name: Run tests
        run: npm test
      - name: Build web output
        run: npm run build

  android-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Expand app source bundle
        run: cat source/native-bundle/part*.b64 | base64 -d | tar -xJ -C .
      - name: Inspect Android SDK configuration
        run: |
          echo '--- app/build.gradle.kts ---'
          sed -n '1,140p' android/app/build.gradle.kts
          echo '--- settings files with Android SDK pins ---'
          grep -RniE 'compileSdk|targetSdk|buildToolsVersion' android --include='*.gradle*' --include='*.properties' || true
      - name: Apply Android manifest merger fix
        run: cp native-patches/android/app/src/main/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
      - name: Add prominent Telegram API settings link
        run: node native-patches/add-telegram-api-link.mjs web/src/main.js
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Apply TDLib 1.8.56 compatibility fixes
        run: node native-patches/patch-tdlib-compat.mjs android/app/src/main/java/com/cloudvault/app/TelegramManager.kt
      - name: Build debug APK
        run: gradle --no-daemon -p android :app:assembleDebug
      - name: Inspect Android manifest metadata
        run: |
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging android/app/build/outputs/apk/debug/app-debug.apk | head -n 8
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
      - name: Build Play Store App Bundle
        run: gradle --no-daemon -p android :app:bundleRelease
      - name: Inspect App Bundle output
        run: ls -lh android/app/build/outputs/bundle/release/app-release.aab
      - name: Upload unsigned release App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: cloudvault-android-release-aab-unsigned
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudvault-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
